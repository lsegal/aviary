# Landing page content for https://aviary.bot/skills/gh-fix/. The docs site
# reads this file, SKILL.md and agents/openai.yaml at build time.
eyebrow: GitHub issue closer
# Wrap the accent word in *asterisks*.
headline: From open issue to *merged.*
tagline: Takes ownership of a GitHub issue and drives the whole delivery loop, from code and proof through CI and the merge to the loose ends after it.
usage: /gh-fix owner/repo#123
steps:
  - title: Claim
    text: Reads the issue, every comment and linked work, and settles what to fix before touching code.
  - title: Branch and draft PR
    text: Opens a fresh clone, a fix branch and a linked draft pull request so the work is visible from the first minute.
  - title: Implement
    text: Reproduces the bug, makes the smallest complete fix, adds focused tests and a changelog note, and pushes checkpoints as it goes.
  - title: Ready for review
    text: Writes up the root cause and the change, attaches screenshots or a recording for UI work, and marks the pull request ready.
  - title: CI
    text: Watches every required check on the current head, reads failures precisely and repairs what its change broke.
  - title: Merge
    text: Merges with the repository's merge method once GitHub agrees, deletes the branch and confirms the issue closed.
  - title: Follow-ups
    text: Files leftover work as linked follow-up issues and puts checks only a person can run in a Manual verification comment.
aviary: Code Loop watches your repositories and boards and runs gh-fix on every issue that is ready, in the CLI you pick, with a slot limit and a live board. Comments that mention the job's @/aviary identity steer it while it runs.
requirements:
  - The GitHub CLI (gh), signed in with repository and workflow access.
  - git, and push access to the repository (or a fork).
  - A CLI agent that loads skills, such as Claude Code, Codex or Gemini CLI.
options:
  - name: owner/repo#123
    text: The issue to fix. A bare number works inside a checkout of the repository.
  - name: and do not merge
    text: Finishes the pull request, marks it ready and drives CI green, then leaves the merge to a person. A do-not-merge label or comment does the same.
  - name: and no changelog
    text: Skips the changelog entry for this fix.
  - name: and use fork owner/repo
    text: Pushes the branch to a fork and opens the pull request from it when you can't write to the repository.
