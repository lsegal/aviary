version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
    ignore:
      # vue-tsc 3.3 imports typescript/lib/tsc, which TypeScript 7 no longer
      # exports, so `pnpm lint:web` and `pnpm package` fail on it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /docs
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    cooldown:
      default-days: 14
    schedule:
      interval: weekly
    groups:
      all:
        patterns:
          - "*"
