name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect Changes
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.docker.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      # Pull requests only build the Docker image when they touch one of its
      # inputs; pushes and releases always build it (#734).
      - id: docker
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          echo "$changed_files"
          if grep -qxE 'Dockerfile|Dockerfile\.dev|docker-compose\.yml|\.dockerignore|go\.mod|go\.sum|package\.json|pnpm-lock\.yaml|\.github/workflows/docker\.yml' <<< "$changed_files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  docs-build:
    name: "Build: Docs"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      # Checks the docs servers honor __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # (#1102); test:scripts covers the web app side.
      - run: node --test scripts/dev-allowed-hosts.test.mjs
      # The build renders the /skills/ share cards and fails if a skill page
      # lacks og:image or twitter:card (#763).
      - run: pnpm build
        working-directory: docs

  go-lint:
    name: "Lint: Go"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go tool golangci-lint run ./...

  go-tests:
    name: "Test: Go (${{ matrix.os }})"
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      # Linux also runs the race detector so data races fail CI (#632).
      - run: go test ${{ matrix.os == 'ubuntu-latest' && '-race' || '' }} ./...

  transcription-e2e:
    name: "Test: Transcription E2E"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      AVIARY_CONFIG_TRANSCRIPTION_MODEL: ${{ github.workspace }}/.whisper/ggml-base.en.bin
      WHISPER_CPP_VERSION: v1.9.6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - id: whisper-cache
        uses: actions/cache@v6
        with:
          path: .whisper-cpp
          key: whisper-cpp-${{ runner.os }}-${{ env.WHISPER_CPP_VERSION }}
      # GGML_NATIVE is off so the cached binary runs on any runner CPU.
      - name: Build whisper-cli
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$WHISPER_CPP_VERSION" https://github.com/ggml-org/whisper.cpp "$RUNNER_TEMP/whisper.cpp"
          cmake -S "$RUNNER_TEMP/whisper.cpp" -B "$RUNNER_TEMP/whisper.cpp/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DGGML_NATIVE=OFF
          cmake --build "$RUNNER_TEMP/whisper.cpp/build" --target whisper-cli -j "$(nproc)"
          mkdir -p .whisper-cpp
          cp "$RUNNER_TEMP/whisper.cpp/build/bin/whisper-cli" .whisper-cpp/
      - run: echo "$GITHUB_WORKSPACE/.whisper-cpp" >> "$GITHUB_PATH"
      - uses: actions/cache@v6
        with:
          path: .whisper
          key: whisper-model-ggml-base.en-v1
      - name: Download whisper model
        run: |
          if [ ! -s "$AVIARY_CONFIG_TRANSCRIPTION_MODEL" ]; then
            mkdir -p .whisper
            curl -fsSL --retry 3 -o "$AVIARY_CONFIG_TRANSCRIPTION_MODEL" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
          fi
      # The tests skip when whisper-cli, ffmpeg, or the model is missing, so
      # a skip here means this job lost its setup and must fail (#979).
      - name: Run end-to-end transcription tests
        run: |
          go test -count=1 -v -run 'TestTranscribeHandler_.*EndToEnd' ./internal/server | tee "$RUNNER_TEMP/transcription-e2e.log"
          if grep -q -- '--- SKIP' "$RUNNER_TEMP/transcription-e2e.log"; then
            echo "::error::end-to-end transcription tests skipped"
            exit 1
          fi
          test "$(grep -c -- '--- PASS: TestTranscribeHandler_' "$RUNNER_TEMP/transcription-e2e.log")" -eq 5

  installer:
    name: "Test: Installer (${{ matrix.name }})"
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: POSIX
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Prepare mocked release API (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: node scripts/mock-installer-fixture.mjs --root "$RUNNER_TEMP/mock-releases" --version v9.9.9 --os linux --arch amd64 --baseUrl http://127.0.0.1:8765
      - name: Run installer against mock server (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg"
          export AVIARY_DOWNLOAD_BASE="http://127.0.0.1:8765"
          mkdir -p "$HOME" "$XDG_CONFIG_HOME"
          node scripts/mock-static-server.mjs --root "$RUNNER_TEMP/mock-releases" --port 8765 > /tmp/aviary-installer-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          # Resolves the latest tag through the releases/latest redirect,
          # verifies the checksum, and runs install-skills.
          sh installer/install.sh --repo lsegal/aviary </dev/null
          test -f "$HOME/.local/bin/aviary"
          test -f "$HOME/.bashrc"
          grep -F "export PATH=\"$HOME/.local/bin:\$PATH\"" "$HOME/.bashrc"
          grep -Fx "installed gh-fix" "$HOME/.agents/skills/gh-fix/install.log"
          # Piped like the documented command, re-running is idempotent.
          sh <installer/install.sh
          test "$(grep -c "local/bin" "$HOME/.bashrc")" = 1
          rm -rf "$HOME/.agents"
          AVIARY_SKIP_SKILLS=1 sh installer/install.sh </dev/null
          test ! -e "$HOME/.agents"
      - name: Prepare mocked release API (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/mock-installer-fixture.mjs --root "$env:RUNNER_TEMP/mock-releases" --version v9.9.9 --os windows --arch amd64 --baseUrl http://127.0.0.1:8765
      - name: Run installer against mock server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HOME = Join-Path $env:RUNNER_TEMP 'home'
          New-Item -ItemType Directory -Path $env:HOME -Force | Out-Null
          $server = Start-Process node -ArgumentList 'scripts/mock-static-server.mjs', '--root', (Join-Path $env:RUNNER_TEMP 'mock-releases'), '--port', '8765' -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 1
            ./installer/install.ps1 -Repo lsegal/aviary -DownloadBase http://127.0.0.1:8765 -SkipSkills
            $bin = Join-Path $env:HOME '.local\bin\aviary.exe'
            if (-not (Test-Path $bin)) {
              throw "installer did not create $bin"
            }
            if (-not (($env:Path -split ';') -contains (Split-Path $bin))) {
              throw "installer did not prepend the bin directory to PATH"
            }
          } finally {
            if ($server) {
              Stop-Process -Id $server.Id -Force
            }
          }

  release-smoke:
    name: "Test: Release Build"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:release -- --version v0.0.0-ci --targets linux/amd64,linux/arm64,windows/amd64,darwin/amd64,darwin/arm64
      - run: test -f dist/release/aviary_v0.0.0-ci_linux_amd64.tar.gz
      - run: test -f dist/release/aviary_v0.0.0-ci_linux_arm64.tar.gz
      - run: test -f dist/release/aviary_v0.0.0-ci_windows_amd64.tar.gz
      - run: test -f dist/release/aviary_v0.0.0-ci_darwin_amd64.tar.gz
      - run: test -f dist/release/aviary_v0.0.0-ci_darwin_arm64.tar.gz
      - run: test -f dist/release/checksums.txt
      - run: test -f dist/release/install.sh
      - run: test -f dist/release/install.ps1
      - run: test -f bucket/aviary.json
      - run: test -f Formula/aviary.rb
      - run: node -e "const fs=require('node:fs'); const manifest=JSON.parse(fs.readFileSync('bucket/aviary.json', 'utf8')); if (manifest.version !== '0.0.0-ci') throw new Error('unexpected scoop version'); if (manifest.bin !== 'aviary.exe') throw new Error('unexpected scoop bin'); if (!manifest.architecture?.['64bit']?.hash) throw new Error('missing scoop hash');"
      - run: node -e "const fs=require('node:fs'); const formula=fs.readFileSync('Formula/aviary.rb', 'utf8'); for (const expected of ['version \"0.0.0-ci\"','aviary_v0.0.0-ci_linux_amd64.tar.gz','aviary_v0.0.0-ci_linux_arm64.tar.gz','aviary_v0.0.0-ci_darwin_amd64.tar.gz','aviary_v0.0.0-ci_darwin_arm64.tar.gz']) { if (!formula.includes(expected)) throw new Error(`missing ${expected}`); }"

  web-lint:
    name: "Lint: Web"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:web
      - run: pnpm test:scripts

  web-e2e:
    name: "Test: Web E2E"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - run: node scripts/build-go.mjs --output aviary
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  docker:
    name: Docker
    needs:
      - changes
      - go-lint
      - go-tests
      - installer
      - release-smoke
      - web-lint
      - web-e2e
    if: needs.changes.outputs.docker == 'true'
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      branch_name: ${{ github.event_name == 'push' && github.ref_name || '' }}
      push_image: ${{ github.event_name != 'pull_request' }}
