name: CodeQL

# Advanced setup replaces GitHub's Default setup so commits whose message
# carries a skip-CI keyword, such as Code Loop checkpoint commits, skip CodeQL
# too. Default setup ignores those keywords (#1416).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: "CodeQL: ${{ matrix.language }}"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
        # Ruby is not analyzed: the only Ruby file is the generated Homebrew
        # formula (Formula/aviary.rb).
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: default
      - if: matrix.build-mode == 'manual'
        run: go build ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
