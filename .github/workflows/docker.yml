name: Docker

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ''
      aviary_version:
        required: false
        type: string
        default: ''
      branch_name:
        required: false
        type: string
        default: ''
      docker_tag:
        required: false
        type: string
        default: ''
      publish_latest:
        required: false
        type: boolean
        default: false
      push_image:
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  docker:
    name: Docker image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      SMOKE_IMAGE: aviary-smoke:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'workflow_call' && inputs.ref || github.sha }}
          persist-credentials: false
      - id: prep
        shell: bash
        env:
          CALL_VERSION: ${{ inputs.aviary_version }}
          CALL_BRANCH: ${{ inputs.branch_name }}
          CALL_TAG: ${{ inputs.docker_tag }}
          INPUT_PUBLISH_LATEST: ${{ inputs.publish_latest }}
          INPUT_PUSH_IMAGE: ${{ inputs.push_image }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -n "$CALL_VERSION" ]]; then
            aviary_version="$CALL_VERSION"
          else
            aviary_version="$(jq -r .version package.json).dev-$(git rev-parse --short HEAD)"
          fi

          branch_name="$CALL_BRANCH"
          if [[ -z "$branch_name" && "$GITHUB_EVENT_NAME" == "push" ]]; then
            branch_name="$GITHUB_REF_NAME"
          fi

          publish_latest="$INPUT_PUBLISH_LATEST"
          if [[ "$publish_latest" != "true" && "$CALL_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            publish_latest="true"
          fi

          push_image="$INPUT_PUSH_IMAGE"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            push_image="false"
          fi

          echo "aviary_version=$aviary_version" >> "$GITHUB_OUTPUT"
          echo "branch_name=$branch_name" >> "$GITHUB_OUTPUT"
          echo "docker_tag=$CALL_TAG" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$publish_latest" >> "$GITHUB_OUTPUT"
          echo "push_image=$push_image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ steps.prep.outputs.branch_name }},enable=${{ steps.prep.outputs.branch_name != '' }}
            type=raw,value=${{ steps.prep.outputs.docker_tag }},enable=${{ steps.prep.outputs.docker_tag != '' }}
            type=raw,value=latest,enable=${{ steps.prep.outputs.publish_latest == 'true' }}
      - name: Build smoke-test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            AVIARY_VERSION=${{ steps.prep.outputs.aviary_version }}
          tags: ${{ env.SMOKE_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail

          docker run -d --rm --name aviary-smoke -p 16677:16677 "${SMOKE_IMAGE}"
          cleanup() {
            docker logs aviary-smoke || true
            docker stop aviary-smoke || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            code="$(curl -ksS -o /dev/null -w "%{http_code}" https://127.0.0.1:16677/ || true)"
            if [[ "$code" != "000" ]]; then
              exit 0
            fi
            code="$(curl -ksS -o /dev/null -w "%{http_code}" https://127.0.0.1:16677/mcp || true)"
            if [[ "$code" != "000" ]]; then
              exit 0
            fi
            sleep 2
          done

          echo "Container did not start serving on port 16677" >&2
          exit 1
      - name: Smoke test transcription
        shell: bash
        run: |
          set -euo pipefail

          # No network: the bundled tools and model must be enough, and the
          # bundled sample clip goes through Aviary's own transcription API.
          docker run --rm --network none "${SMOKE_IMAGE}" bash -euo pipefail -c '
            whisper-cli --help >/dev/null
            ffmpeg -version | head -n 1

            status="$(aviary deps status)"
            echo "$status"
            if grep -q missing <<<"$status"; then
              echo "aviary deps status reports missing transcription dependencies" >&2
              exit 1
            fi

            ffmpeg -nostdin -loglevel error -i /opt/aviary/samples/jfk.wav -c:a libopus /tmp/jfk.ogg

            aviary serve >/tmp/serve.log 2>&1 &
            for _ in $(seq 1 30); do
              if [[ -s ~/.config/aviary/token ]] && curl -ksS -o /dev/null https://127.0.0.1:16677/ 2>/dev/null; then
                break
              fi
              sleep 2
            done
            token="$(cat ~/.config/aviary/token)"

            ready="$(curl -ksS -H "Authorization: Bearer ${token}" https://127.0.0.1:16677/api/transcription)"
            echo "$ready"
            grep -q "\"ready\":true" <<<"$ready"

            transcript="$(curl -ksS -H "Authorization: Bearer ${token}" -H "Content-Type: audio/ogg" --data-binary @/tmp/jfk.ogg https://127.0.0.1:16677/api/transcribe)"
            echo "$transcript"
            if ! grep -qi "ask not what your country can do for you" <<<"$transcript"; then
              cat /tmp/serve.log >&2
              echo "transcript of the bundled sample does not match" >&2
              exit 1
            fi
          '
      - name: Smoke test container TLS
        run: scripts/docker-tls-smoke.sh "${SMOKE_IMAGE}"
      - name: Report image size
        if: steps.prep.outputs.push_image != 'true'
        shell: bash
        run: |
          set -euo pipefail
          size() { docker image inspect --format '{{.Size}}' "$1" | awk '{ printf "%.0f MB", $1 / 1000000 }'; }
          {
            echo "| Image | Size |"
            echo "| --- | --- |"
            echo "| This build | $(size "${SMOKE_IMAGE}") |"
            if docker pull -q "ghcr.io/${{ github.repository }}:latest" >/dev/null 2>&1; then
              echo "| Published latest | $(size "ghcr.io/${{ github.repository }}:latest") |"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.prep.outputs.push_image == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: steps.prep.outputs.push_image == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            AVIARY_VERSION=${{ steps.prep.outputs.aviary_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  whisper-arm64:
    name: whisper.cpp arm64 build
    permissions:
      contents: read
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'workflow_call' && inputs.ref || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build whisper.cpp stage for linux/arm64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          target: whisper-smoke
          platforms: linux/arm64
          load: true
          push: false
          tags: aviary-whisper-arm64:${{ github.run_id }}
          cache-from: type=gha,scope=whisper-arm64
          cache-to: type=gha,scope=whisper-arm64,mode=max
      - name: Transcribe the sample clip on arm64
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none "aviary-whisper-arm64:${{ github.run_id }}" bash -euo pipefail -c '
            /opt/whisper.cpp/whisper-cli --help >/dev/null
            transcript="$(/opt/whisper.cpp/whisper-cli -m /opt/aviary/models/ggml-base.en.bin -f /opt/aviary/samples/jfk.wav -np -nt)"
            echo "$transcript"
            grep -qi "ask not what your country can do for you" <<<"$transcript"
          '
