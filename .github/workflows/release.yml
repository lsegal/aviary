name: Release

on:
  workflow_dispatch:
    inputs:
      level:
        description: Release level
        required: true
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch
          - version
      version:
        description: Version to release (if version is selected)
        required: false
        type: string

permissions: {}

jobs:
  release:
    name: Build and publish release assets
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      VERSION: ${{ inputs.level == 'version' && inputs.version || inputs.level }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The release commit is created through the API and main is moved to it
      # immediately, before any required status check can report on it. An
      # app that is a bypass actor on the main ruleset can make that update;
      # GITHUB_TOKEN cannot (#1562). See "Publishing a Release" in
      # CONTRIBUTING.md for the one-time setup.
      - name: Mint release app token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Setup git credentials
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - run: pnpm release
        env:
          RELEASE_TOKEN: ${{ steps.app-token.outputs.token }}
      - id: version
        run: echo "tag=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

  installer-smoke:
    name: Smoke test the public installer
    permissions:
      contents: read
    needs: release
    uses: $/.github/workflows/installer-smoke.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  docker:
    name: Publish Docker image
    permissions:
      contents: read
      packages: write
    needs: release
    uses: $/.github/workflows/docker.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
      aviary_version: ${{ needs.release.outputs.tag }}
      docker_tag: ${{ needs.release.outputs.tag }}
      push_image: true
