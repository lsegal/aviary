name: Release

on:
  workflow_dispatch:
    inputs:
      level:
        description: Release level
        required: true
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch
          - version
      version:
        description: Version to release (if version is selected)
        required: false
        type: string

permissions: {}

jobs:
  release:
    name: Build and publish release assets
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      VERSION: ${{ inputs.level == 'version' && inputs.version || inputs.level }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Setup git credentials
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - run: pnpm release
      - id: version
        run: echo "tag=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

  installer-smoke:
    name: Smoke test the public installer
    permissions:
      contents: read
    needs: release
    uses: $/.github/workflows/installer-smoke.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  docker:
    name: Publish Docker image
    permissions:
      contents: read
      packages: write
    needs: release
    uses: $/.github/workflows/docker.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
      aviary_version: ${{ needs.release.outputs.tag }}
      docker_tag: ${{ needs.release.outputs.tag }}
      push_image: true
