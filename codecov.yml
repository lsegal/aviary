# Codecov settings (#1369). Coverage is reported on every pull request but
# never blocks a merge.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - "web/dist"
  - "node_modules"
  - "docs"
  - "**/*_test.go"
  - "**/testdata"
