<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aviary</title>
    <meta name="description" content="Control panel for your Aviary AI agents" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101828" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aviary" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Apply the cached display preferences (#1093) before the first paint,
      // so a load never flashes the wrong theme or text size. Mirrors
      // applyDisplayPrefs in src/lib/displayPrefs.ts.
      (() => {
        var prefs = {};
        try {
          prefs = JSON.parse(localStorage.getItem("aviary.display.prefs") || "{}") || {};
        } catch (e) {}
        var theme = prefs.theme;
        if (theme !== "light" && theme !== "dark")
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.dataset.textSize =
          ["small", "large", "xlarge"].indexOf(prefs.textSize) >= 0 ? prefs.textSize : "default";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
